  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: rgba(99, 102, 241, 0.12);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius: 16px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:

        radial-gradient(circle at 85% 65%, rgba(56, 189, 248, 0.12), transparent 40%);

      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;

    header {

      top: 0;
      z-index: 100;

      background: rgba(11, 15, 25, 0.85);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 0;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 16px;

      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);

      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      object-fit: cover;

    .brand-name {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;

      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px;
      border-radius: 30px;
      border: 1px solid var(--card-border);
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.775rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: var(--transition);
    }

    .lang-btn:hover {
      color: var(--text);
    }

    .lang-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }

    main {
      flex: 1;
      padding: 48px 0 64px;
    }

    .policy-header {
      margin-bottom: 36px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 30px;
      margin-bottom: 16px;
    }

      font-size: clamp(2rem, 4.5vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .last-updated {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .policy-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 36px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin-top: 32px;
      margin-bottom: 14px;
      padding-bottom: 8px;

      display: flex;
      align-items: center;
      gap: 10px;

    .policy-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .policy-card p {
      color: var(--text-muted);
      margin-bottom: 14px;
      font-size: 0.96rem;
    }

    .policy-card ul {
      margin-left: 20px;
      margin-bottom: 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .policy-card li {
      margin-bottom: 8px;
    }

    .policy-card strong {
      color: var(--text);
    }

    .policy-card a {
      color: var(--accent);
      text-decoration: none;
      transition: var(--transition);
    }

    .policy-card a:hover {
      text-decoration: underline;
    }

    .highlight-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 12px;
      padding: 18px 20px;
      margin: 20px 0;
    }

    .highlight-box p {
      margin-bottom: 0;
      color: #e0e7ff;
      font-size: 0.925rem;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--card-border);
      padding: 32px 0;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.875rem;
      margin-top: auto;
    }

    .footer-links {

      justify-content: center;
      gap: 24px;
      margin-bottom: 14px;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition);
    }

    .footer-links a:hover {
      color: #fff;
    }

    @media (max-width: 640px) {
      .policy-card {
        padding: 24px 18px;
      }
      .brand-name {
        display: none;
      }
      .nav-inner {
        gap: 8px;

</head>

        body: `
          <h2>1. Introduction & Overview</h2>
          <p>This Privacy Policy explains how <strong>Calendario Turni</strong> ("Application", "We", "Us", or "Our"), developed by <strong>Daniele Sforza</strong>, handles information when you use our mobile application on iOS and Android devices. Daniele Sforza is the data controller for the limited data described in Section 4.</p>

          <div class="highlight-box">
            <p><strong>🔒 Privacy First Principle:</strong> Calendario Turni is designed from the ground up with a privacy-first, offline-capable architecture. Your calendar events, shift schedules, custom notes, earnings calculations, and settings remain stored locally on your device and are never uploaded to our servers.</p>
          </div>

          <h2>2. Personal Data & Local Processing</h2>
          <h3>Local Device Storage</h3>
          <p>All data entered into the Application—including work shifts, rotations, hourly wages, notes, attachments, and calendar preferences—is stored locally on your device, inside the Application's private, sandboxed storage (Hive databases). We do not operate remote databases storing your personal shift schedules.</p>

          <h3>Backups</h3>
          <p>Copies of this data exist outside the Application only in two cases: the device backup provided by your operating system (Google or iCloud backup, linked to your own account), and the backup files you export yourself. We have no access to either.</p>

          <h3>On-Device Artificial Intelligence</h3>
          <p>Features powered by artificial intelligence (such as theme generation) run on your device, using the on-device models provided by your operating system (Gemini Nano through Android AICore, or Apple's on-device models on iOS). Your prompt inputs and schedule data are never transmitted to cloud AI servers.</p>

          <h2>3. Device Permissions</h2>
          <p>The Application may request specific operating system permissions strictly to provide core features:</p>
          <ul>
            <li><strong>Calendar Permission (Read/Write):</strong> Used solely to allow you to export, synchronize, or view your work shifts within your device's native system calendar (e.g. Apple Calendar, Google Calendar). This synchronization is executed directly on-device. If the calendar you choose belongs to an online account (for example Google or iCloud), the events written to it are then synchronized by that account's provider.</li>
            <li><strong>Camera, Microphone & Photos:</strong> Used only when you choose to attach a photo, a video, or a scanned document to a day. Attachments stay on your device.</li>
            <li><strong>Storage / Files:</strong> Used only when you explicitly choose to attach a file, or to backup, export, or import your shift database as a local file.</li>

          <h2>4. Third-Party Services & Diagnostics</h2>
          <p>To ensure application stability, troubleshoot issues, allow user feedback, and manage in-app purchases, we integrate trusted third-party services:</p>

          <h3>A. Crash Reporting & Diagnostics (Sentry)</h3>
          <p>We use <strong>Sentry</strong> (provided by Functional Software, Inc., USA) to monitor application stability, crashes, and performance bottlenecks. Our Sentry data is stored in Sentry's European Union data region (Germany). When an unexpected error occurs, Sentry collects:</p>

          </ul>
          <p><strong>Privacy Safeguards & In-App Control:</strong> Automatic screenshot capture during crashes is permanently disabled, and the names of files you attach are removed from reports before they leave your device. Sentry never accesses your calendar entries or shift notes during crash reporting. Furthermore, you can disable automatic crash reporting at any time in the app via <strong>Settings &rarr; Terms &amp; Privacy &rarr; Anonymous Crash Reports</strong>.</p>
          <p>For more details, visit <a href="https://sentry.io/privacy/" target="_blank" rel="noopener">Sentry's Privacy Policy</a>.</p>

          <h3>B. User-Initiated Feedback & Support (Sentry)</h3>
          <p>When you choose to use the in-app <strong>Send Visual Feedback</strong> tool (available only while crash reports are enabled), the following information is transmitted securely to Sentry solely to diagnose your issue and provide support:</p>
          <ul>
            <li>Your written feedback description.</li>
            <li>A visual screenshot of the app screen where the tool was opened, which may show the shifts and notes visible on that screen (including any drawings or annotations you choose to add).</li>
            <li><strong>Optional Contact Information:</strong> You may optionally provide your <strong>Name</strong> and <strong>Email address</strong> if you wish to receive a reply or follow-up from the developer. Providing this information is entirely voluntary.</li>

          <h3>C. In-App Purchases (RevenueCat)</h3>
          <p>We use <strong>RevenueCat</strong> (RevenueCat, Inc., USA) to verify in-app purchases and unlock the PRO version, including when you restore a purchase on a new device. RevenueCat processes a pseudonymous app user identifier (the <strong>Customer ID</strong> shown in Settings), purchase receipts, and the purchase status generated by the Apple App Store or Google Play Store.</p>
          <p>All monetary transactions and payment details (such as credit cards or billing addresses) are handled exclusively by Apple or Google and are never accessible to Us or RevenueCat.</p>
          <p>For more details, visit <a href="https://www.revenuecat.com/privacy/" target="_blank" rel="noopener">RevenueCat's Privacy Policy</a>.</p>

          <h3>D. Other Network Requests</h3>
          <ul>
            <li><strong>Public holidays:</strong> To show public holidays, the Application downloads the list for your country and year from the public <strong>Nager.Date</strong> service (date.nager.at). The request contains only the year and the country code.</li>
            <li><strong>Fonts:</strong> The Application may download font files from <strong>Google Fonts</strong> (Google LLC) the first time they are needed, and then keeps them on your device.</li>
            <li><strong>Google Calendar:</strong> When you choose to create an event in Google Calendar from the Application, the details of that shift are passed to Google Calendar, which opens outside the Application.</li>
          </ul>
          <p>As with any internet connection, the services listed in this section technically receive your device's IP address when the Application contacts them.</p>

          <h2>5. Legal Bases for Processing (GDPR)</h2>
          <p>If you are located in the European Economic Area (EEA), our legal bases for processing data under the General Data Protection Regulation (GDPR) are:</p>
          <ul>
            <li><strong>Consent (Art. 6(1)(a) GDPR):</strong> When you voluntarily submit feedback, screenshots, or optional contact information (name and email) via the in-app feedback tool.</li>
            <li><strong>Performance of a Contract (Art. 6(1)(b) GDPR):</strong> To deliver app functionality and give you access to the features you purchased.</li>
            <li><strong>Legitimate Interests (Art. 6(1)(f) GDPR):</strong> To monitor app performance, fix software bugs, and maintain security. You can object at any time by turning off crash reports in Settings.</li>
          </ul>
          <p><strong>International transfers:</strong> Sentry data is stored in the European Union. RevenueCat, Google, and Apple may process data in the United States or in other countries outside the EEA; these transfers rely on the safeguards provided for by the GDPR, such as Standard Contractual Clauses or the EU–U.S. Data Privacy Framework.</p>

          <h2>6. Your Rights (GDPR, CCPA / CPRA)</h2>
          <p>If you are located in the EEA, you have the right to access, rectify, or erase your personal data, to restrict or object to its processing, to data portability, and to withdraw your consent at any time. To exercise these rights, write to <a href="mailto:info@danielesforza.dev">info@danielesforza.dev</a> and include the <strong>Customer ID</strong> shown in the app's Settings, so that we can locate the data linked to your installation. You also have the right to lodge a complaint with the data protection authority of your country of residence.</p>
          <p>Under the California Consumer Privacy Act (CCPA) and California Privacy Rights Act (CPRA):</p>
          <ul>
            <li>We <strong>do not sell</strong> your personal information.</li>
            <li>We <strong>do not share</strong> your personal information with third parties for cross-context behavioral advertising.</li>
            <li>You can opt out of automatic diagnostic reporting at any time in the app's Settings.</li>
            <li>You have the right to request information about the diagnostic and feedback data collected and request its deletion by contacting us.</li>
          </ul>

          <h2>7. Data Retention & Deletion</h2>
          <p>Since your schedule data is stored locally on your device, deleting the Application or clearing its local storage permanently erases all your stored shifts and settings. Diagnostic reports and user feedback stored by Sentry are deleted automatically within 90 days. Purchase records are kept by RevenueCat for as long as needed to keep your purchase available to you, and are deleted on request.</p>

          <h2>8. Children's Privacy</h2>
          <p>Our Service is not directed to children under the age of 13 (or 16 in the EEA). We do not knowingly collect personal information from children.</p>

          <h2>9. Changes to This Privacy Policy</h2>
          <p>We may update this Privacy Policy from time to time. Any changes will be posted directly on this page with an updated "Last updated" revision date.</p>

          <h2>10. Contact Us & Data Controller</h2>
          <p>If you have any questions, suggestions, or requests regarding this Privacy Policy, please contact us at:</p>
          <p><strong>Email:</strong> <a href="mailto:info@danielesforza.dev">info@danielesforza.dev</a><br>
          <strong>Developer and data controller:</strong> Daniele Sforza</p>
        `

          <h2>5. Basi Giuridiche del Trattamento (GDPR)</h2>

    function setLanguage(lang) {
      if (!content[lang]) lang = 'en';
      const c = content[lang];

      document.documentElement.lang = lang;
      document.getElementById('meta-title').textContent = c.metaTitle;
      document.getElementById('btn-back').textContent = c.btnBack;
      document.getElementById('badge-text').textContent = c.badgeText;
      document.getElementById('title-text').textContent = c.titleText;
      document.getElementById('updated-text').textContent = c.updatedText;
      document.getElementById('policy-content').innerHTML = c.body;
      document.getElementById('footer-support').textContent = c.footerSupport;
      document.getElementById('footer-privacy').textContent = c.footerPrivacy;
      document.getElementById('footer-copy').innerHTML = c.footerCopy;

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      localStorage.setItem('privacy_preferred_lang', lang);
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
    });

    const saved = localStorage.getItem('privacy_preferred_lang') || localStorage.getItem('preferred_lang');
    const browserLang = (navigator.language || 'it').substring(0, 2).toLowerCase();
    const initialLang = saved || (content[browserLang] ? browserLang : 'it');
    setLanguage(initialLang);
  </script>
